<!doctype html>
<html lang="es" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mantos App - Acceso</title>
    <style>
      :root {
        --blue-900: #061744;
        --blue-800: #08256f;
        --blue-700: #0647a5;
        --blue-500: #1268d6;
        --blue-100: #d8e8fb;
        --surface: #eef5fc;
        --line: #557092;
        --radius: 8px;
      }

      :root[data-theme="dark"] {
        --surface: #101c2d;
        --blue-100: #143556;
        --line: #4a6684;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        background: #0b4fb3;
      }

      .phone {
        display: flex;
        width: min(100%, 430px);
        min-height: 100vh;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        margin: 0 auto;
        padding: 48px 24px;
        background: linear-gradient(180deg, #061744 0%, #0b4fb3 100%);
      }

      .welcome {
        width: min(100%, 420px);
        color: #fff;
        text-align: center;
      }

      .welcome h1 {
        margin: 0 0 14px;
        font-size: clamp(38px, 10vw, 48px);
        line-height: 1.05;
        text-shadow: 0 3px 10px rgba(0, 0, 0, 0.28);
      }

      .welcome p {
        margin: 0;
        color: #e8f2ff;
        font-size: 17px;
        font-weight: 650;
        line-height: 1.45;
      }

      .logo-wrap {
        width: 160px;
        height: 160px;
        overflow: hidden;
        border: 1.5px solid rgba(255, 255, 255, 0.36);
        border-radius: var(--radius);
        background: rgba(255, 255, 255, 0.08);
        box-shadow: 0 18px 34px rgba(0, 0, 0, 0.24);
      }

      .logo-wrap img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .divider {
        width: 58px;
        height: 3px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.58);
      }

      .brand {
        margin: 0;
        color: #ffffff;
        font-size: 30px;
        font-weight: 950;
        letter-spacing: 0;
        text-transform: uppercase;
        text-shadow: 0 3px 10px rgba(0, 0, 0, 0.24);
      }

      .access-card {
        display: grid;
        width: min(100%, 380px);
        gap: 10px;
        padding: 10px;
        border: 1.5px solid rgba(255, 255, 255, 0.42);
        border-radius: var(--radius);
        background: rgba(238, 245, 252, 0.97);
        box-shadow: 0 20px 44px rgba(0, 0, 0, 0.24);
      }

      :root[data-theme="dark"] .access-card {
        border-color: rgba(216, 236, 255, 0.34);
        background: rgba(16, 28, 45, 0.96);
      }

      button {
        min-height: 62px;
        border-radius: var(--radius);
        font: inherit;
        font-size: 17px;
        font-weight: 950;
        cursor: pointer;
      }

      .admin {
        border: 1.5px solid #d1dceb;
        background: #ffffff;
        color: #061744;
      }

      .user {
        border: 1.5px solid var(--blue-700);
        background: var(--blue-700);
        color: #ffffff;
      }

      .theme {
        display: inline-flex;
        min-height: 52px;
        align-items: center;
        justify-content: center;
        gap: 10px;
        border: 1.5px solid var(--line);
        background: var(--blue-100);
        color: var(--blue-900);
        font-size: 15px;
        font-weight: 900;
      }

      .theme span {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: var(--blue-700);
        box-shadow: 0 0 0 4px rgba(6, 71, 165, 0.14);
      }

      :root[data-theme="dark"] .admin {
        border-color: rgba(216, 236, 255, 0.34);
        background: #eef5ff;
        color: #06101d;
      }

      :root[data-theme="dark"] .user {
        border-color: #8cc7ff;
        background: #58afff;
        color: #06101d;
      }

      :root[data-theme="dark"] .theme {
        color: #d8ecff;
      }

      :root[data-theme="dark"] .theme span {
        background: #d8ecff;
      }
    </style>
  </head>
  <body>
    <main class="phone">
      <section class="welcome">
        <h1>Bienvenido</h1>
        <p>Seleccione el tipo de acceso para continuar con Mantos App.</p>
      </section>

      <div class="logo-wrap">
        <img src="public/mantos_group_logo.jpg" alt="Mantos Group" />
      </div>

      <div class="divider"></div>
      <h2 class="brand">Mantos Group</h2>

      <section class="access-card">
        <button class="admin" type="button">Acceder como administrador</button>
        <button class="user" type="button">Acceder como usuario</button>
        <button class="theme" type="button" onclick="toggleTheme()"><span></span>Modo oscuro</button>
      </section>
    </main>

    <script>
      function toggleTheme() {
        const root = document.documentElement;
        const next = root.dataset.theme === "dark" ? "light" : "dark";
        root.dataset.theme = next;
        document.querySelector(".theme").lastChild.textContent = next === "dark" ? "Modo claro" : "Modo oscuro";
      }
    </script>
  </body>
</html>
